services:
  checkout-demo:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    environment:
      # Settings live on a shared volume so Sentinel can apply the human-approved fix where the app reads it.
      DEMO_SETTINGS_PATH: /config/settings.json
    volumes:
      - demo-settings:/config
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  k6:
    image: grafana/k6:0.53.0
    profiles: ["load"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      checkout-demo:
        condition: service_healthy
    volumes:
      - ./load/checkout.js:/scripts/checkout.js:ro
    command: ["run", "--vus", "100", "--duration", "2m", "/scripts/checkout.js"]

volumes:
  demo-settings:
    name: checkout-demo-settings
