name: Checkout CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Validate repair settings
        run: python -c "import json; s=json.load(open('app/settings.json')); assert isinstance(s['demo_faults_enabled'], bool); assert 0 <= s['checkout_error_rate'] <= 1"
